<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>东方国际象棋</title>
<style>
  :root{
    --ink:#23252B; --paper:#F3EEE3; --light:#E4DAC6; --dark:#8E9B87;
    --shu:#C0392B; --line:#C9C0AE; --sel:#D9A441; --fogc:#191A1F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px; line-height:1.5; padding:14px 12px 40px;
    max-width:540px; margin:0 auto;
  }
  h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:20px;font-weight:600;margin:0 0 2px}
  .sub{color:#6E6A60;font-size:13px;margin:0 0 12px}
  button{font:inherit;color:var(--ink);background:transparent;
    border:1px solid var(--line);border-radius:2px;cursor:pointer}
  button:disabled{opacity:.35;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .row button{flex:1;min-width:84px;padding:8px 6px;font-size:14px}
  .row select{flex:1;min-width:84px;padding:8px 6px;font-size:14px;font-family:inherit;
    background:var(--paper);border:1px solid var(--ink);color:inherit;border-radius:0}
  button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .statusbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;min-height:24px}
  #status{font-weight:600}
  #status.alert{color:var(--shu)}
  #material{font-size:13px;color:#6E6A60;font-variant-numeric:tabular-nums}
  .boardwrap{position:relative}
  #board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;
    border:1px solid var(--ink);touch-action:manipulation;user-select:none}
  .sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;min-width:0;min-height:0}
  .sq.l{background:var(--light)}
  .sq.d{background:var(--dark)}
  .sq.fog{background:var(--fogc)}
  .sq.zone::before{content:"";position:absolute;inset:0;background:rgba(217,164,65,.20)}
  .sq.frozen::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(45deg,rgba(70,130,190,.32) 0 4px,transparent 4px 8px)}
  .sq.last::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px rgba(217,164,65,.85)}
  .sq.sel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--sel);background:rgba(217,164,65,.22)}
  .sq.check::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--shu)}
  .dot{position:absolute;width:24%;height:24%;border-radius:50%;background:rgba(35,37,43,.38);pointer-events:none}
  .ring{position:absolute;inset:8%;border-radius:50%;border:3px solid rgba(192,57,43,.7);pointer-events:none}
  .pc{line-height:1;pointer-events:none;position:relative;z-index:1;font-size:min(8.4vw,44px)}
  .pc.cjk{font-size:min(7vw,36px);font-weight:600;
    font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols2","Noto Serif SC",serif}
  .pc.w{color:#FCF9F2;text-shadow:0 0 1px #23252B,0 1px 0 #23252B,1px 0 0 #23252B,-1px 0 0 #23252B,0 -1px 0 #23252B}
  .pc.b{color:#23252B;text-shadow:0 0 1px #FCF9F2,0 1px 0 #FCF9F2,1px 0 0 #FCF9F2,-1px 0 0 #FCF9F2,0 -1px 0 #FCF9F2}
  .coord{position:absolute;font-size:9px;color:rgba(35,37,43,.45);pointer-events:none}
  .coord.f{right:2px;bottom:1px}
  .coord.r{left:2px;top:1px}
  .sq.fog .coord{color:rgba(243,238,227,.28)}
  #palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:10px 0}
  #palette button{padding:6px 5px;font-size:12px;line-height:1.3;text-align:left}
  #palette button .g{font-size:15px;margin-right:4px;font-family:"Noto Serif SC",serif}
  #palette button .v{color:#8A8578;float:right}
  .tier{grid-column:1/-1;font-size:12px;color:#8A8578;margin-top:4px;border-top:1px solid var(--line);padding-top:5px}
  #moves{border-top:1px solid var(--line);padding-top:10px;font-size:13px;
    font-variant-numeric:tabular-nums;max-height:120px;overflow:auto;line-height:1.9}
  #moves .n{color:#8A8578;margin-right:4px}
  #moves span.m{margin-right:12px;white-space:nowrap}
  .note{font-size:12.5px;color:#6E6A60;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  #promo{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(243,238,227,.92)}
  #promo.on{display:flex}
  #promo .box{background:var(--paper);border:1px solid var(--ink);padding:10px 12px;display:flex;gap:6px}
  #promo button{font-size:26px;width:48px;height:48px;pointer-events:auto;font-family:"Noto Serif SC",serif}
  :focus-visible{outline:2px solid var(--shu);outline-offset:1px}
  .hide{display:none !important}
  #evalWrap{margin-top:10px}
  #evalWrap label{font-size:12.5px;color:#6E6A60;margin-right:12px;cursor:pointer;user-select:none}
  #evalPanel{margin-top:8px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;
    padding:8px 10px;background:#FBFAF8;line-height:1.75}
  #evalPanel.hide{display:none}
  #evalPanel .eh{color:#6E6A60;font-size:11.5px;margin-bottom:4px}
  #evalPanel .er{display:flex;gap:10px;align-items:baseline;white-space:nowrap}
  #evalPanel .en{width:4.5em;color:#6E6A60;flex:none}
  #evalPanel .ed{width:7em;flex:none;font-variant-numeric:tabular-nums}
  #evalPanel .ev{width:4.5em;flex:none;font-variant-numeric:tabular-nums;font-weight:600}
  #evalPanel .em{flex:1;overflow:hidden;text-overflow:ellipsis}
  #evalPanel .stop{color:#A8A29A}
</style>
</head>
<body>
 
<h1 id="title">东方国际象棋</h1>
<div class="row"><button id="lang">English</button></div>
<p class="sub" id="phasehint">部署阶段 · 每方45点 · 先点棋子再点棋盘落子，点已放的子可移除</p>
 
<div class="row" id="sideRow">
  <button id="tabW" aria-pressed="true">白方 <span id="ptW">0</span>/45</button>
  <button id="tabB" aria-pressed="false">黑方 <span id="ptB">0</span>/45</button>
</div>
<div class="row" id="deployRow">
  <button id="preset">香草阵型</button>
  <button id="clearSide">清空本方</button>
  <button id="start">开始对局</button>
</div>
 
<div class="statusbar hide" id="bar">
  <span id="status"></span>
  <span id="material"></span>
</div>
 
<div class="boardwrap">
  <div id="board"></div>
  <div id="promo"><div class="box" id="promoBox"></div></div>
</div>
 
<div id="palette"></div>
 
<div class="row hide" id="playRow">
  <button id="undo">悔棋</button>
  <button id="flip">翻转</button>
  <button id="redeploy">重新部署</button>
  <select id="botSide">
    <option value="">电脑：关</option>
    <option value="b">电脑执黑</option>
    <option value="w">电脑执白</option>
    <option value="wb">电脑自对弈</option>
  </select>
  <select id="botLv">
    <option value="cirno">琪露诺 Cirno</option>
    <option value="rinnosuke" selected>霖之助 Rinnosuke</option>
    <option value="patchouli">帕秋莉 Patchouli</option>
    <option value="eirin">永琳 Eirin</option>
  </select>
  <div id="evalWrap">
    <label><input type="checkbox" id="evSage"> <span id="evSageL">贤者引擎评估</span></label>
    <label><input type="checkbox" id="evDev"> <span id="evDevL">开发者引擎评估</span></label>
    <div id="evalPanel" class="hide"></div>
  </div>
</div>
<div id="moves" class="hide"></div>
<p class="note" id="note"></p>
 
<script id="main">
"use strict";
/* ENGINE-START */
/* GENERATED_ENGINE */
/* ENGINE-END */
// UI/session state belongs to the page, never to the engine bundle.
let S,history=[],moveLog=[],lastMove=null,sel=null,legalCache=[],flipped=false,pendingPromo=null;
let phase='deploy',side=W,pick=null;
const deploy={w:new Map(),b:new Map()};
let posHist=[];
const posSync=()=>TouhouChess.setPosHist(posHist);
const pointsOf=c=>TouhouChess.pointsOf(deploy[c]);
const readySide=c=>TouhouChess.readySide(deploy[c]);
const buildState=()=>TouhouChess.buildState(deploy.w,deploy.b);
function outcome(s,ms){
  const r=TouhouChess.outcome(s,ms);
  const text=r.code==='mates'?tr('mates',tr(r.winner===W?'white':'black'))
    :r.code==='toMove'?tr('toMove',tr(r.toMove===W?'white':'black'))+(r.check?tr('chk'):'')
    :tr(r.code);
  return {...r,text};
}

let botTimer=null;
const botSides=()=>($('botSide')?$('botSide').value:'');
function botStop(){if(botTimer){clearTimeout(botTimer);botTimer=null;}}
function botMaybe(){
  botStop();
  if(phase!=='play'||pendingPromo)return;
  if(botSides().indexOf(S.turn)<0)return;
  if(outcome(S,legalCache).over)return;
  $('status').textContent=tr('thinking');
  botTimer=setTimeout(()=>{botTimer=null;
    if(phase!=='play'||botSides().indexOf(S.turn)<0)return;
    const lv=LEVELS[$('botLv').value]||LEVELS.rinnosuke;
    const m=pickMove(S,depthFor(lv,S),lv.blunder,lv.subopt);
    if(m)doMove(m);},60);}
 
/* ================= 引擎评估面板 ================= */
/* 分析搜索放进独立线程（Web Worker）：主线程不参与搜索，所以界面不会卡，
   而深度**不设固定上限** —— 给人看的分析越深越准。
   对局用的引擎仍在主线程、仍按档位限深度，那是为了落子响应快。
   两个引擎各起一个 Worker，所以同时开时由操作系统分到不同核上，
   比我原来在主线程里手工交错分片更合理。
 
   Worker 的源码直接复用页面里 ENGINE-START/END 之间那段（它不碰 DOM）。
   但 file:// 打开时浏览器对 blob: Worker 的同源策略不一致，可能创建失败，
   所以保留主线程分片作为回落路径 —— 那条路必须给单个根走法设时间预算，
   因为主线程上搜索时间就是界面卡住的时间，而根走法是原子的没法中途暂停。 */
const EV={sage:mkEv(),dev:mkEv()};
function mkEv(){return{d:0,v:null,mv:null,done:0,err:0,w:null,noWorker:0,
  wd:0,ms:null,i:0,best:null,bv:-Infinity};}
const EVBUDGET=700;      /* 只用于回落路径：主线程最长卡住这么久 */
const EVMAIN_MAX=12;     /* 只用于回落路径 */
let evTimer=null,evKey=null,evSrc=null;
const evOn=k=>!!$(k==='sage'?'evSage':'evDev').checked;
 
/* 从内联脚本里切出引擎源码 */
function engineSource(){
  if(evSrc!==null)return evSrc;
  try{
    const t=$('main').textContent;
    const a=t.indexOf('/* ENGINE-START'),b=t.indexOf('/* ENGINE-END */');
    evSrc=(a<0||b<0)?'':t.slice(a,b);
  }catch(e){evSrc='';}
  return evSrc;}
 
const EV_GLUE=`
self.onmessage=function(ev){
  var d=ev.data;
  OPT.open=d.plain?0:1;
  setPosHist(d.hist||[]);
  setSearchState({rep:new Set(d.hist||[])});                       /* 独立线程，不限时 */
  clearOrderTables();
  var s=d.state,prev=null;
  for(var depth=1;true;depth++){
    var t0=Date.now();
    var ms=pseudoAll(s);
    if(!ms.length)break;
    if(prev){                      /* 上一层的优选排最前 */
      for(var j=0;j<ms.length;j++)
        if(ms[j].from===prev.from&&ms[j].to===prev.to){
          var tmp=ms[0];ms[0]=ms[j];ms[j]=tmp;break;}}
    var best=null,bv=-Infinity,legal=0;
    for(var i=0;i<ms.length;i++){
      var m=ms[i],ns=tryMove(s,m);
      if(!ns)continue;
      legal++;
      var v;
      /* 根节点 PVS：第一手全窗口，其余零宽试探，试探失败才重搜 */
      if(legal===1)v=-negamax(vanishPass(ns),depth-1,-Infinity,Infinity,1);
      else{
        v=-negamax(vanishPass(ns),depth-1,-(bv+1),-bv,1);
        if(v>bv)v=-negamax(vanishPass(ns),depth-1,-Infinity,Infinity,1);}
      if(v>bv){bv=v;best=m;}}
    if(!legal)break;
    prev=best;
    self.postMessage({depth:depth,score:bv,ms:Date.now()-t0,
      move:best?{from:best.from,to:best.to,promo:best.promo||null,
                 drop:best.drop||null,castle:best.castle}:null});
  }
  self.postMessage({done:1});
};`;
 
function evKill(k){const e=EV[k];if(e.w){try{e.w.terminate();}catch(x){}e.w=null;}}
function evHalt(){if(evTimer){clearTimeout(evTimer);evTimer=null;}}
function evReset(){
  evHalt();
  for(const k in EV){evKill(k);const w=EV[k].noWorker;EV[k]=mkEv();EV[k].noWorker=w;}
  evKey=phase==='play'?posKey(S):null;
  evRender();
  if(phase!=='play'||!evKey)return;
  if(outcome(S,legalCache).over)return;
  for(const k of['sage','dev'])if(evOn(k))evLaunch(k);}
 
/* 这一路还没跑就起来；已经在跑或已有结果就不动 */
function evEnsure(k){
  if(phase!=='play')return;
  if(!evKey)evKey=posKey(S);
  if(outcome(S,legalCache).over)return;
  const e=EV[k];
  if(e.w||e.d||e.done)return;        // 已经在跑或已有结果
  evLaunch(k);}
 
function evLaunch(k){
  const e=EV[k];
  if(e.noWorker)return evKick();            /* 已知不能用 Worker，走主线程 */
  const src=engineSource();
  if(!src){e.noWorker=1;return evKick();}
  let w;
  try{
    w=new Worker(URL.createObjectURL(new Blob([src+EV_GLUE],
        {type:'application/javascript'})));
  }catch(x){e.noWorker=1;return evKick();}
  e.w=w;
  w.onmessage=ev=>{
    const m=ev.data;
    if(m.done){e.done=1;evRender();return;}
    e.d=m.depth;e.v=m.score;e.mv=m.move;e.layerMs=m.ms;
    evRender();};
  w.onerror=()=>{                            /* 创建成功但跑不起来：回落 */
    e.noWorker=1;evKill(k);e.d=0;e.v=null;e.mv=null;evKick();};
  try{
    w.postMessage({state:S,hist:posHist.slice(),plain:k==='dev'});
  }catch(x){e.noWorker=1;evKill(k);evKick();}}
 
/* ---- 回落路径：主线程，按根走法分片，单片有时间预算 ---- */
function evKick(){if(!evTimer)evTimer=setTimeout(evStep,0);}
function evStep(){
  evTimer=null;
  if(phase!=='play'||!evKey)return;
  if(posKey(S)!==evKey)return evReset();
  if(outcome(S,legalCache).over||pendingPromo)return;
  if(botTimer)return evKick();
  const cand=Object.keys(EV).filter(k=>evOn(k)&&EV[k].noWorker&&!EV[k].done&&EV[k].d<EVMAIN_MAX);
  if(!cand.length)return;
  cand.sort((a,b)=>(EV[a].d-EV[b].d)||(EV[a].i-EV[b].i));
  const k=cand[0],e=EV[k];
  const save=OPT.open;if(k==='dev')OPT.open=0;
  const t0=performance.now();
  setSearchState({rep:new Set(posHist),end:t0+EVBUDGET});
  let aborted=0;
  try{
    if(e.ms===null){
      const ms=pseudoAll(S);
      if(!ms.length){e.done=1;return;}
      if(e.mv){const j=ms.findIndex(m=>m.from===e.mv.from&&m.to===e.mv.to);
        if(j>0){const t=ms[0];ms[0]=ms[j];ms[j]=t;}}
      e.wd=e.d+1;e.ms=ms;e.i=0;e.best=null;e.bv=-Infinity;}
    const m=e.ms[e.i],ns=tryMove(S,m);
    if(ns){
      const v=-negamax(vanishPass(ns),e.wd-1,-Infinity,Infinity,1);
      if(v>e.bv){e.bv=v;e.best=m;}}
    e.i++;
    if(e.i>=e.ms.length){
      if(e.best){e.d=e.wd;e.v=e.bv;e.mv=e.best;}else e.done=1;
      e.ms=null;e.i=0;}
  }catch(err){if(err===EVABORT)aborted=1;else e.done=1;}
  finally{OPT.open=save;clearSearchDeadline();}
  if(aborted){e.ms=null;e.i=0;e.done=1;}   /* 一手都算不完这一层：停在上一层 */
  if(posKey(S)!==evKey)return evReset();
  evRender();evKick();}
 
/* ---- 显示 ---- */
const evWhite=v=>S.turn===W?v:-v;
function evFmt(v){
  if(v===null||v===undefined)return '—';
  if(Math.abs(v)>MATE/2)return evWhite(v)>0?'+M':'-M';
  const x=evWhite(v)/100;
  return (x>0?'+':'')+x.toFixed(2);}
function evMoveText(mv){
  if(!mv)return '—';
  try{
    const m=legalCache.find(x=>x.from===mv.from&&x.to===mv.to
      &&(x.promo||null)===(mv.promo||null)&&(x.drop||null)===(mv.drop||null));
    if(!m)return '—';
    const ns=applyMove(S,m),t=S;S=ns;const nms=legalMoves(ns);S=t;
    return notate(S,m,ns,nms);}catch(e){return '—';}}
function evRender(){
  const box=$('evalPanel');if(!box)return;
  const any=evOn('sage')||evOn('dev');
  box.className=any&&phase==='play'?'':'hide';
  if(!any||phase!=='play'){box.innerHTML='';return;}
  const over=outcome(S,legalCache).over;
  let h='<div class="eh">'+tr('evHead')+'</div>';
  for(const k of['sage','dev']){
    if(!evOn(k))continue;
    const e=EV[k];
    let dep=e.d?tr('evDepth',e.d):'';
    const tag=[];
    if(e.noWorker)tag.push(tr('evMainThread'));
    if(e.done&&e.d)tag.push(tr('evStop'));
    const st=tag.length?' <span class="stop">'+tag.join(' ')+'</span>':'';
    h+='<div class="er"><span class="en">'+tr(k==='sage'?'evSage':'evDev')+'</span>'
      +'<span class="ed">'+dep+'</span>'
      +'<span class="ev">'+evFmt(e.v)+'</span>'
      +'<span class="em">'+(over?tr('evOver')
        :(e.d?tr('evBest',evMoveText(e.mv))+st:tr('evThinking')+st))+'</span></div>';}
  box.innerHTML=h;}
 
/* ================= UI ================= */
const $=id=>document.getElementById(id);
const boardEl=$('board'),paletteEl=$('palette');
/* ================= 语言 ================= */
const EN={k:'King',q:'Queen',r:'Rook',b:'Bishop',n:'Knight',p:'Pawn',
  keda:'Kedama',onmyo:'Yin-Yang Orb',ghost:'Ghost',
  doll:'Doll',shanghai:'Shanghai',rabbit:'Rabbit',tewi:'Tewi',
  fairy:'Fairy',daiyousei:'Daiyousei',sunny:'Sunny',cirno:'Cirno',
  reimu:'Reimu',sanae:'Sanae',
  lumia:'Rumia',koishi:'Koishi',iku:'Iku',ryuu:'Dragon King',
  alice:'Alice',yukari:'Yukari'};
for(const k in EN)if(P[k])P[k].en=EN[k];
let LANG='zh';
const TXT={
  title:['东方国际象棋','Touhou Chess'],
  hintDeploy:['部署阶段 · 每方45点 · 先点棋子再点棋盘落子，点已放的子可移除',
    'Deployment · 45 points each · pick a piece, then a square; click a placed piece to remove it'],
  hintPlay:['对局中 · 点选己方棋子再点目标格','Playing · click your piece, then the target square'],
  white:['白方','White'], black:['黑方','Black'],
  preset:['香草阵型','Vanilla setup'], clearSide:['清空本方','Clear side'],
  start:['开始对局','Start game'],
  undo:['悔棋','Undo'], flip:['翻转','Flip'], redeploy:['重新部署','Redeploy'],
  botOff:['电脑：关','CPU: off'], botB:['电脑执黑','CPU plays Black'],
  botW:['电脑执白','CPU plays White'], botWB:['电脑自对弈','CPU self-play'],
  thinking:['电脑思考中…','Thinking…'],
  noMoves:['还没有走子。','No moves yet.'],
  matUnknown:['子力不明','Material unknown'],
  undecided:['未定','none yet'],
  dropA:['打入','Drop '], promoTo:['升变为','Promote to '], moveA:['移动','Move '],
  notePlay:['蓝色斜纹＝被琪露诺冻结；黑格＝露米娅的黑暗（可盲点）；子力后的弹为剩余弹药。',
    'Blue hatching = frozen by Cirno; black squares = Rumia\u0027s darkness (you may click blind); the ammo figure after the material count is points left for drops.'],
  noteDeploy:['本方已用 %1 点，剩余 %2 点作为弹药。将军对象：%3 个（需要恰好1个）。',
    'Used %1 pts, %2 pts left as ammo. Royal pieces: %3 (need exactly 1).'],
  royalW:['　白方王：','　White royal: '], royalB:['　黑方王：','　Black royal: '],
  selected:['　当前选中：','　Selected: '],
  fileLimit:['（只能放 d 列或 h 列）',' (d- or h-file only)'],
  mates:['%1将杀','%1 mates'], stalemate:['逼和','Stalemate'],
  rep3:['三次重复和棋','Draw by threefold repetition'],
  fifty:['50回合和棋','Draw by 50-move rule'],
  toMove:['%1走棋','%1 to move'], chk:['（将军）',' (check)'],
  tierVanilla:['香草级','Vanilla'], tierKedama:['毛玉级','Kedama'],
  tierFairy:['妖精级','Fairy'], tierHuman:['人类级','Human'],
  tierYoukai:['妖怪级','Youkai'], tierMagician:['魔法使级','Magician'],
  tierSage:['贤者级','Sage'],
  langBtn:['English','中文'],
  evSageL:['永琳引擎评估','Eirin engine eval'],
  evDevL:['开发者引擎评估','Dev engine eval'],
  evHead:['分差为正 = 白优；独立线程持续加深，不设深度上限',
          'Positive = White ahead; a separate thread keeps deepening, no depth cap'],
  evSage:['永琳','Eirin'], evDev:['开发者','Dev'],
  evDepth:['深度%1','d%1'], evProg:['第%1层 %2/%3','d%1 %2/%3'],
  evMainThread:['主线程','main thread'], evStop:['已停','stopped'], evBest:['优选 %1','best %1'],
  evThinking:['计算中…','thinking…'], evOver:['对局已结束','game over']};
function tr(k){const a=TXT[k];let v=a?a[LANG==='en'?1:0]:k;
  for(let i=1;i<arguments.length;i++)v=v.replace('%'+i,arguments[i]);
  return v;}
const pn=ty=>LANG==='en'?(P[ty].en||P[ty].n):P[ty].n;
function applyLang(){
  $('title').textContent=tr('title');
  $('lang').textContent=tr('langBtn');
  $('tabW').innerHTML=tr('white')+' <span id="ptW">0</span>/45';
  $('tabB').innerHTML=tr('black')+' <span id="ptB">0</span>/45';
  $('preset').textContent=tr('preset');$('clearSide').textContent=tr('clearSide');
  $('start').textContent=tr('start');
  $('undo').textContent=tr('undo');$('flip').textContent=tr('flip');
  $('redeploy').textContent=tr('redeploy');
  const bs=$('botSide').options;
  bs[0].textContent=tr('botOff');bs[1].textContent=tr('botB');
  bs[2].textContent=tr('botW');bs[3].textContent=tr('botWB');
  $('phasehint').textContent=phase==='deploy'?tr('hintDeploy'):tr('hintPlay');
  $('evSageL').textContent=tr('evSageL');$('evDevL').textContent=tr('evDevL');
  if(phase==='play')$('note').textContent=tr('notePlay');
  buildPalette();render();
  if(typeof evRender==='function')evRender();}
 
 
 
const chessG=g=>{const c=g.codePointAt(0);return c>=0x2654&&c<=0x265F;};
const isCJK=g=>!chessG(g);
 
function render(){phase==='deploy'?renderDeploy():renderPlay();}
 
function renderDeploy(){
  boardEl.innerHTML='';
  for(let vr=0;vr<8;vr++)for(let vf=0;vf<8;vf++){
    const r=flipped?7-vr:vr,f=flipped?7-vf:vf,i=at(r,f);
    const d=document.createElement('div');
    d.className='sq '+(((r+f)&1)?'d':'l');
    const sl=slotOf(i,side);
    if(sl&&pick&&P[pick].slots.indexOf(sl)>=0&&!deploy[W].has(i)&&!deploy[B].has(i)&&cirnoOK(i))d.classList.add('zone');
    d.dataset.i=i;
    for(const c of[W,B]){const t=deploy[c].get(i);
      if(t){const g=document.createElement('span');
        g.className='pc '+c+(isCJK(P[t].g)?' cjk':'');
        g.textContent=P[t].g;d.appendChild(g);}}
    if(vr===7){const c=document.createElement('span');c.className='coord f';c.textContent="abcdefgh"[f];d.appendChild(c);}
    if(vf===0){const c=document.createElement('span');c.className='coord r';c.textContent=8-r;d.appendChild(c);}
    boardEl.appendChild(d);}
  $('ptW').textContent=fmt(pointsOf(W));$('ptB').textContent=fmt(pointsOf(B));
  const rc=[...deploy[side].values()].filter(t=>P[t].royal).length;
  $('start').disabled=!(readySide(W)&&readySide(B));
  const roy=c=>{for(const ty of deploy[c].values())if(P[ty].royal)return pn(ty);return tr('undecided');};
  $('note').textContent=tr('noteDeploy',fmt(pointsOf(side)),fmt(45-pointsOf(side)),rc)
    +tr('royalW')+roy(W)+tr('royalB')+roy(B)
    +(pick?tr('selected')+pn(pick)+(P[pick].files?tr('fileLimit'):''):'');}
 
function renderPlay(){
  const ms=legalCache,res=outcome(S,ms);
  $('status').textContent=res.text;$('status').classList.toggle('alert',!!res.alert);
  const fz=frozenSet(S),dark=darkSet(S);
  let vw=0,vb=0;for(const p of S.b)if(p){if(p.c===W)vw+=P[p.t].cost;else vb+=P[p.t].cost;}
  $('material').textContent=dark.size?tr('matUnknown')
    :('\u767D '+fmt(vw)+'\uFF0B'+fmt(S.ammo.w)+'\u5F39 \u00B7 \u9ED1 '+fmt(vb)+'\uFF0B'+fmt(S.ammo.b)+'\u5F39');
  const targets=new Map();
  if(sel!==null&&!dark.has(sel))for(const m of ms)if(m.from===sel)targets.set(m.to,m);
  const ck=royals(S,S.turn).filter(k=>isAttacked(S,k,S.turn===W?B:W,fz));
  boardEl.innerHTML='';
  for(let vr=0;vr<8;vr++)for(let vf=0;vf<8;vf++){
    const r=flipped?7-vr:vr,f=flipped?7-vf:vf,i=at(r,f);
    const fog=dark.has(i);
    const d=document.createElement('div');
    d.className='sq '+(((r+f)&1)?'d':'l')+(fog?' fog':'');
    if(!fog){
      if(i===sel)d.classList.add('sel');
      else if(lastMove&&(i===lastMove.from||i===lastMove.to))d.classList.add('last');
      if(ck.indexOf(i)>=0)d.classList.add('check');
      if(fz.has(i)&&S.b[i])d.classList.add('frozen');}
    d.dataset.i=i;
    const p=S.b[i];
    if(p&&!fog){const g=document.createElement('span');
      g.className='pc '+p.c+(isCJK(P[p.t].g)?' cjk':'');
      g.textContent=P[p.t].g;d.appendChild(g);}
    if(targets.has(i)&&!fog){const m=targets.get(i),mk=document.createElement('span');
      mk.className=(p||m.epc||m.drop)?'ring':'dot';d.appendChild(mk);}
    if(vr===7){const c=document.createElement('span');c.className='coord f';c.textContent="abcdefgh"[f];d.appendChild(c);}
    if(vf===0){const c=document.createElement('span');c.className='coord r';c.textContent=8-r;d.appendChild(c);}
    boardEl.appendChild(d);}
  let h='';for(let k=0;k<moveLog.length;k+=2)
    h+='<span class="m"><span class="n">'+(k/2+1)+'.</span>'+moveLog[k]+(moveLog[k+1]?' '+moveLog[k+1]:'')+'</span>';
  $('moves').innerHTML=h||'<span style="color:#8A8578">'+tr('noMoves')+'</span>';
  $('undo').disabled=history.length===0;}
 
function buildPalette(){
  const tiers=[['tierVanilla',['k','q','r','b','n','p']],
    ['tierKedama',['keda','onmyo','ghost']],
    ['tierFairy',['rabbit','fairy','daiyousei','sunny','cirno']],
    ['tierHuman',['reimu','sanae']],
    ['tierYoukai',['lumia','koishi','iku']],
    ['tierMagician',['alice']],
    ['tierSage',['yukari']]];
  paletteEl.innerHTML='';
  for(const[tn,list]of tiers){
    const h=document.createElement('div');h.className='tier';h.textContent=tr(tn);paletteEl.appendChild(h);
    for(const ty of list){const b=document.createElement('button');
      b.innerHTML='<span class="g">'+P[ty].g+'</span>'+pn(ty)+'<span class="v">'+fmt(P[ty].cost)+'</span>';
      b.setAttribute('aria-pressed',String(pick===ty));
      b.onclick=()=>{pick=pick===ty?null:ty;buildPalette();render();};
      paletteEl.appendChild(b);}}}
 
boardEl.addEventListener('click',e=>{
  const sq=e.target.closest('.sq');if(!sq)return;
  const i=+sq.dataset.i;
  phase==='deploy'?deployClick(i):playClick(i);});
 
// 部署数量限制：max=每方上限；limit='sqcolor' 表示同色格最多1枚（两枚同色格的琪露诺会互冻）
function cirnoOK(i){
  const d=P[pick];
  if(d.files&&d.files.indexOf(file(i))<0)return false;   // 限定列（八云紫只能 d/h）
  let same=0,total=0;
  const col=(rank(i)+file(i))&1;
  for(const[j,t]of deploy[side]){if(t!==pick)continue;total++;
    if(((rank(j)+file(j))&1)===col)same++;}
  if(d.max&&total>=d.max)return false;
  if(d.limit==='sqcolor')return same===0&&total<2;
  return true;}
function deployClick(i){
  if(deploy[side].has(i)){deploy[side].delete(i);render();return;}
  if(!pick)return;
  const sl=slotOf(i,side);
  if(!sl||P[pick].slots.indexOf(sl)<0)return;
  if(deploy[W].has(i)||deploy[B].has(i))return;
  if(!cirnoOK(i))return;
  deploy[side].set(i,pick);render();}
 
function playClick(i){
  if(pendingPromo)return;
  if(outcome(S,legalCache).over)return;
  const dark=darkSet(S),p=S.b[i];
  if(sel!==null){
    const c=legalCache.filter(m=>m.from===sel&&m.to===i);
    if(c.length===1){doMove(c[0]);return;}
    if(c.length>1){
      const seen=new Set(),dd=[];
      for(const m of c){const k=(m.promo||'')+'|'+(m.drop||'')+'|'+(m.castle===undefined?'':m.castle);
        if(seen.has(k))continue;seen.add(k);dd.push(m);}
      if(dd.length===1)doMove(dd[0]);else askChoice(dd);
      return;}}
  if(dark.has(i))sel=i;
  else sel=(p&&p.c===S.turn)?i:null;
  render();}
 
function doMove(m){
  const dark=darkSet(S),hidden=dark.has(m.from)||dark.has(m.to);
  let ns=m._n||applyMove(S,m);
  const tmp=S;S=ns;const nms=legalMoves(ns);S=tmp;
  history.push({S,lastMove,log:moveLog.slice()});
  moveLog.push(hidden?'\u22EF':notate(S,m,ns,nms));
  S=vanishPass(ns);posHist.push(posKey(S));posSync();lastMove={from:m.from,to:m.to};sel=null;
  legalCache=legalMoves(S);render();botMaybe();evReset();}
 
function askChoice(c){pendingPromo=c;$('promoBox').innerHTML='';
  for(const m of c){const b=document.createElement('button');
    const t=m.promo||m.drop||S.b[m.from].t;
    b.className='pc '+S.turn+(isCJK(P[t].g)?' cjk':'');
    b.textContent=P[t].g;
    b.title=m.drop?(tr('dropA')+pn(m.drop)):(m.promo?(tr('promoTo')+pn(m.promo)):(tr('moveA')+pn(t)));
    b.onclick=()=>{$('promo').classList.remove('on');pendingPromo=null;doMove(m);};
    $('promoBox').appendChild(b);}
  $('promo').classList.add('on');}
 
$('tabW').onclick=()=>{side=W;$('tabW').setAttribute('aria-pressed','true');
  $('tabB').setAttribute('aria-pressed','false');render();};
$('tabB').onclick=()=>{side=B;$('tabB').setAttribute('aria-pressed','true');
  $('tabW').setAttribute('aria-pressed','false');render();};
$('clearSide').onclick=()=>{deploy[side].clear();render();};
$('preset').onclick=()=>{const back=['r','n','b','q','k','b','n','r'];
  deploy[side].clear();
  const br=side===W?7:0,pr=side===W?6:1;
  for(let f=0;f<8;f++){deploy[side].set(at(br,f),back[f]);deploy[side].set(at(pr,f),'p');}
  render();};
$('start').onclick=()=>{S=buildState();history=[];moveLog=[];lastMove=null;sel=null;
  posHist=[posKey(S)];posSync();
  legalCache=legalMoves(S);phase='play';botStop();
  $('sideRow').classList.add('hide');$('deployRow').classList.add('hide');
  paletteEl.classList.add('hide');$('bar').classList.remove('hide');
  $('playRow').classList.remove('hide');$('moves').classList.remove('hide');
  $('phasehint').textContent=tr('hintPlay');
  $('note').textContent=tr('notePlay');
  render();botMaybe();evReset();};
$('redeploy').onclick=()=>{phase='deploy';botStop();
  $('sideRow').classList.remove('hide');$('deployRow').classList.remove('hide');
  paletteEl.classList.remove('hide');$('bar').classList.add('hide');
  $('playRow').classList.add('hide');$('moves').classList.add('hide');
  $('phasehint').textContent=tr('hintDeploy');render();evReset();};
$('flip').onclick=()=>{flipped=!flipped;render();};
$('botSide').onchange=()=>botMaybe();
/* 开关只影响这一路要不要跑，不清掉另一路已经算好的层
   —— 清空是局面变化才做的事 */
function evToggle(k){
  if(evOn(k))evEnsure(k); else {evKill(k);EV[k]=mkEv();}
  evRender();}
$('evSage').onchange=()=>evToggle('sage');
$('evDev').onchange=()=>evToggle('dev');
$('undo').onclick=()=>{botStop();if(!history.length)return;
  const h=history.pop();S=h.S;lastMove=h.lastMove;moveLog=h.log;sel=null;posHist.pop();posSync();
  legalCache=legalMoves(S);render();evReset();};
 
$('lang').onclick=()=>{LANG=LANG==='en'?'zh':'en';applyLang();};
applyLang();
</script>
