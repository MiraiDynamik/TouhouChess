# 规则书名字 → 引擎里的键。这是整个项目里唯一需要人工维护的映射表，
# 而它只管「哪个名字对应哪个键」，不含任何数值或部署位 —— 抄错不了。
# unimplemented 列出规则书里还没实装的棋子；
# lab/check_rules.py 要求双向完整：
#   规则书每个名字必须在 key 里或 unimplemented 里（漏一个报错）
#   实现里每个键必须被某个名字指到（多一个报错）

